name : Postman Collection Workflow

on: 
  push: 
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 30 02 * * * # 8 AM IST
    - cron: 00 14 * * * # 7.30 PM IST
    - cron: 00 06 * * 1-5 # 11.30 AM IST Mon - Fri

jobs:
  run-postman-tests:
    runs-on: ec2-github-runner

    steps: 
    
      - name: Checkout the code
        uses: actions/checkout@v4.4.0

      - name: Install Nodejs and npm
        uses: actions/setup-node@v6.5.0
        with: 
          node-version: '24'

      - name: Install newman and htmlextra globally
        run: |
              npm install -g newman
              npm install -g newman-reporter-htmlextra

      - name: Run the Postman Collection with Newman
        run: |
              newman run 'Inwarranty-flow Collection.postman_collection.json' \
              -e QA.postman_environment.json \
              -d testData.csv \
              -r cli,htmlextra \
              --reporter-htmlextra-export ./newman/index.html

      - name : Newman Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with: 
          name: Newman Report
          path: newman/*.html

      - name : Creating GitHub page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/


      - name: Send Email Notifications
        if: always()
        uses: dawidd6/action-send-mail@v18
        with: 
            server_address: smtp.gmail.com
            server_port: 465
            username: ${{ secrets.EMAIL_USERNAME }}
            password: ${{ secrets.EMAIL_PASSWORD }}
            subject: Phoenix Inwarranty Flow Test Execution Notification
            to: basakmona8@gmail.com
            from: ${{ secrets.EMAIL_USERNAME }}
            body: |
                  Hi All,

                  Phoenix Inwarranty Flow Tests has been executed. The Report has been published and
                  the URL 
                  is: https://monalisasdet.github.io/Phoenix-Inwarranty-Flow/
                    
            
            
              
              
        
          
    
      
  
    
